[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e /home/zen/.local/bin/foot-tmux-session
prompt="❯ "
icons-enabled=no
# hide-before-typing=yes
list-executables-in-path=no
show-actions=no
fields=filename,name,generic,keywords,comment,exec
match-mode=fzf
sort-result=yes
lines=12
width=42
horizontal-pad=8
vertical-pad=8
inner-pad=2
line-height=20
image-size-ratio=0
layer=overlay
anchor=center

[colors]
background=282828f5
text=ebdbb2ff
prompt=8ec07cff
placeholder=928374ff
input=fbf1c7ff
match=83a598ff
selection=3c3836ff
selection-text=fbf1c7ff
selection-match=fabd2fff
counter=928374ff
border=b8bb26ff

[border]
width=2
radius=5
