[buffer]
# Keep scripting, cookies, and referrers disabled unless enabled for an
# individual site. Images are enabled globally for Sixel-capable terminals.
images = true
user-style = '''
html {
  background-color: #282828;
  color: #ebdbb2;
}
a:link { color: #83a598; }
a:visited { color: #d3869b; }
a:focus { color: #282828; background-color: #b8bb26; }
'''

[display]
color-mode = "true-color"
highlight-color = "#b8bb26"
image-mode = "sixel"

[external]
editor = "nvim +%d %s"

[input]
vi-numeric-prefix = true
