[general]
default-menu-cmd = fzf

[ui]
# folders | threaded message list | selected-message preview
sidebar-width = 22
border-char-horizontal = " "
dirlist-left = " {{.Folder}}"
dirlist-right = "{{if .Unread}}{{humanReadable .Unread}}{{end}} "
message-list-split = vertical 55
mouse-enabled = true
tab-title-account = {{.Account}}: {{.Folder}} ({{.Unread .Folder}}/{{.Exists .Folder}})

# Compact message-state icons (JetBrainsMono Nerd Font).
icon-attachment = 
icon-new =
icon-old =
icon-replied = 
icon-forwarded = 
icon-flagged = 
icon-marked =
icon-draft = 
icon-deleted = 

# Keep metadata visually secondary to the sender and subject.
index-columns = flags:=,name<20%,subject,date>=
column-separator = " "
column-flags = {{if or .HasAttachment .IsReplied .IsForwarded .IsFlagged .IsDraft}} {{if .HasAttachment}}{{.Style "" "index_dim"}}{{end}}{{if .IsReplied}}{{if .HasAttachment}} {{end}}{{.Style "" "index_dim"}}{{end}}{{if .IsForwarded}}{{if or .HasAttachment .IsReplied}} {{end}}{{.Style "" "index_dim"}}{{end}}{{if .IsFlagged}}{{if or .HasAttachment .IsReplied .IsForwarded}} {{end}}{{.Style "" "index_flagged"}}{{end}}{{if .IsDraft}}{{if or .HasAttachment .IsReplied .IsForwarded .IsFlagged}} {{end}}{{.Style "" "index_dim"}}{{end}}{{end}}
column-name = {{.Style (index (.From | names) 0) "index_sender"}}
column-subject = {{.Style .ThreadPrefix "index_thread"}}{{.Style .Subject "index_subject"}}
column-date = {{.Style (.DateAutoFormat .Date.Local) "index_dim"}}{{" "}}

# Moving through the list previews mail without changing its unread state.
auto-mark-read-split = false

threading-enabled = true
force-client-threads = false
threading-by-subject = false
reverse-thread-order = true
show-thread-context = false
thread-prefix-tip = "▶"
sort = -r date
styleset-name = gruvbox
fuzzy-complete = true
completion-delay = 50ms

[viewer]
alternatives = text/plain,text/html
pager = less -Rc -~ +g -J --status-col-width=1 --wordwrap -Q --no-vbell
show-headers = true
header-layout =

[filters]
# These renderers are provided by the Arch aerc package under
# /usr/lib/aerc/filters/.
text/plain = colorize-short-links
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
text/html = html-cha
application/pdf = pdftotext -layout - -
.headers = aerc-header-render

[openers]
# Open documents and images in their dedicated Wayland viewers.
application/pdf = zathura {}
image/* = swayimg {}

# Interactive Chawan needs its own terminal when launched by aerc.
text/html = env -u TMUX foot --app-id=cha --title=Chawan cha --config /home/zen/.config/chawan/email.toml --type text/html {}
x-scheme-handler/http* = env -u TMUX foot --app-id=cha --title=Chawan cha {}
