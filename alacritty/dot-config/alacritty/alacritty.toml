[window]
dynamic_padding = true

[scrolling]
history = 100000
multiplier = 3

[font]
size = 8.0

[font.normal]
family = "JetBrainsMono Nerd Font"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"

[bell]
animation = "EaseOutExpo"
duration = 100
color = "#fb4934"

[[keyboard.bindings]]
key = "X"
mods = "Control|Shift"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "{"
mods = "Control|Shift"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

# Make y behave like tmux copy-mode: copy, leave Vi mode, and resume at the
# live bottom of the terminal. Alacritty executes matching bindings in order.
[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "Copy"

[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "ScrollToBottom"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.search.matches]
foreground = "#282828"
background = "#fabd2f"

[colors.search.focused_match]
foreground = "CellBackground"
background = "CellForeground"

[colors.footer_bar]
foreground = "#282828"
background = "#a89984"

[colors.line_indicator]
foreground = "#282828"
background = "#83a598"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
