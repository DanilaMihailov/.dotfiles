[general]
default-menu-cmd = fzf

[ui]
# folders | threaded message list | selected-message preview
sidebar-width = 22
dirlist-left = " {{.Folder}}"
dirlist-right = "{{if .Unread}}{{humanReadable .Unread}}{{end}} "
message-list-split = vertical 55
mouse-enabled = true
tab-title-account = {{.Account}}: {{.Folder}} ({{.Unread .Folder}}/{{.Exists .Folder}})

# Keep metadata visually secondary to the sender and subject.
column-flags = {{.Style (.Flags | join "") "index_dim"}}
column-name = {{.Style (index (.From | names) 0) "index_sender"}}
column-subject = {{.Style .ThreadPrefix "index_thread"}}{{.Style .Subject "index_subject"}}
column-date = {{.Style (.DateAutoFormat .Date.Local) "index_dim"}}

# Moving through the list previews mail without changing its unread state.
auto-mark-read-split = false

threading-enabled = true
force-client-threads = false
threading-by-subject = false
reverse-thread-order = true
show-thread-context = false
sort = -r date
styleset-name = gruvbox
fuzzy-complete = true
completion-delay = 50ms

[viewer]
alternatives = text/plain,text/html
pager = less -Rc -~ +g -J --status-col-width=1 --wordwrap -Q --no-vbell

[filters]
# These renderers are provided by the Arch aerc package under
# /usr/lib/aerc/filters/.
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
text/html = ! html
.headers = colorize

[openers]
# Open HTML parts and selected web links interactively in Chawan.
text/html = cha {}
x-scheme-handler/http* = cha {}
