general {
    hide_cursor = true
    ignore_empty_input = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}

background {
    monitor =
    color = rgba(282828ff)
}

label {
    monitor =
    text = $TIME
    color = rgba(ebdbb2ff)
    font_size = 64
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(b8bb26ff)
    capslock_color = rgba(fabd2fff)
    inner_color = rgba(3c3836ff)
    font_color = rgba(ebdbb2ff)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = rgba(8ec07cff)
    font_size = 16
    position = 120, -20
    halign = center
    valign = center
    onclick = hyprctl switchxkblayout all next
}

label {
    monitor =
    text = cmd[update:250] $HOME/.config/hypr/scripts/hyprlock-caps-state
    color = rgba(fabd2fff)
    font_size = 16
    position = -120, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(a89984ff)
    font_size = 16
    position = 0, -110
    halign = center
    valign = center
}
